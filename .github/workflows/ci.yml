name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Weekly, so a break from a dependency or a PHP point release shows up on a
  # Monday rather than inside someone's pull request.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        # --prefer-lowest is not padding. The constraints in composer.json are
        # a promise about what this works with, and installing the floor of
        # every range is the only thing that tests it.
        deps: ['highest', 'lowest']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          # Everything up to xmlwriter is PHPUnit's, from its composer.json plus
          # what its bootstrap checks at runtime; ctype and tokenizer are
          # runtime-only, so a list built from `require` alone installs fine and
          # then refuses to run. curl and phar are Composer's. intl is the
          # engine's: the number filters use NumberFormatter.
          extensions: none, ctype, dom, filter, json, libxml, mbstring, tokenizer, xml, xmlwriter, curl, phar, intl

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          if [ "${{ matrix.deps }}" = 'lowest' ]; then
            composer update --prefer-lowest --prefer-dist --no-interaction --no-progress
          else
            composer update --prefer-dist --no-interaction --no-progress
          fi

      - name: Lint sources
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Run tests
        run: vendor/bin/phpunit --testdox

  boundary:
    name: No framework or application coupling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This engine is meant to run outside Symfony. It uses a few Symfony
      # CONTRACT packages by design (property access, translation), but must
      # never reach for the HTTP kernel or the DI container -- that is the
      # bundle's job, and depending on it here would silently make the engine
      # unusable standalone. Asserted rather than trusted.
      - name: Assert no kernel or container coupling
        run: |
          if grep -rnE 'Symfony\\Component\\(HttpKernel|DependencyInjection|HttpFoundation)' src/ ; then
            echo "::error::src/ reaches for the framework; that belongs in coolms/dtmpl-bundle"
            exit 1
          fi
          if grep -rnE '\bApp\\+[A-Z]' src/ ; then
            echo "::error::src/ references an application namespace"
            exit 1
          fi
          echo "confirmed: no kernel, container or application coupling"
